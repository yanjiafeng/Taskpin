<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="pin3" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ff6b5b"/>
      <stop offset="0.6" stop-color="#d93a2b"/>
      <stop offset="1" stop-color="#b02a1e"/>
    </radialGradient>
    <linearGradient id="cork3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2a272"/>
      <stop offset="1" stop-color="#b98c5c"/>
    </linearGradient>
  </defs>
  <!-- 软木板 -->
  <rect width="64" height="64" rx="14" fill="url(#cork3)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#a87a4e" stroke-width="1.5" opacity="0.5"/>
  <g fill="#a87a4e" opacity="0.28">
    <ellipse cx="9" cy="10" rx="2.2" ry="1.4"/>
    <ellipse cx="55" cy="9" rx="1.8" ry="1.2"/>
    <ellipse cx="6" cy="53" rx="2" ry="1.3"/>
    <ellipse cx="57" cy="55" rx="2.2" ry="1.4"/>
  </g>
  <!-- 便签 + 手绘验收勾 -->
  <g transform="rotate(3 32 34)">
    <rect x="14" y="18" width="36" height="34" rx="2" fill="#b08a52" opacity="0.45" transform="translate(1.5 2)"/>
    <rect x="14" y="18" width="36" height="34" rx="2" fill="#cdf0c8"/>
    <!-- 手绘横线 -->
    <g fill="#4a3f30" opacity="0.3">
      <rect x="19" y="24" width="26" height="2.4" rx="1.2"/>
      <rect x="19" y="30" width="17" height="2.4" rx="1.2"/>
    </g>
    <!-- 手绘对勾（验收通过） -->
    <path d="M21 40.5 L28.5 47 L44 33.5" fill="none" stroke="#35704a" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- 图钉投影 + 图钉 -->
  <ellipse cx="32" cy="20.5" rx="5" ry="2.4" fill="#6b4c2e" opacity="0.35"/>
  <circle cx="32" cy="14.5" r="6.2" fill="url(#pin3)"/>
  <circle cx="32" cy="14.5" r="6.2" fill="none" stroke="#8c1f14" stroke-width="0.8" opacity="0.6"/>
  <ellipse cx="29.8" cy="12.3" rx="1.9" ry="1.3" fill="#ffffff" opacity="0.55"/>
</svg>
