<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图标候选预览 — Task Board</title>
<style>
  body{font-family:-apple-system,"PingFang SC",sans-serif;background:#f7edd8;color:#4a3f30;padding:32px;margin:0}
  h1{font-size:20px;margin:0 0 24px}
  .row{display:flex;gap:40px;flex-wrap:wrap}
  .cand{background:#fffdf5;border:1px solid #e0d2b8;border-radius:12px;padding:20px;text-align:center}
  .cand h2{font-size:14px;margin:0 0 14px}
  .sizes{display:flex;align-items:flex-end;gap:14px;justify-content:center}
  .sizes img{image-rendering:auto;border-radius:22%;box-shadow:0 2px 8px rgba(107,76,46,.25)}
  .cur{margin-top:28px;font-size:13px;color:#7a6a52}
  .cur img{border-radius:22%;vertical-align:middle}
</style>
</head>
<body>
<h1>Task Board 图标候选（软木便利贴主题）</h1>
<div class="row">
  <div class="cand"><h2>V1 · 图钉便签</h2><div class="sizes">
    <img src="icon-v1-pin-note.svg" width="128" height="128">
    <img src="icon-v1-pin-note.svg" width="64" height="64">
    <img src="icon-v1-pin-note.svg" width="32" height="32">
    <img src="icon-v1-pin-note.svg" width="16" height="16">
  </div></div>
  <div class="cand"><h2>V2 · 三列看板便签</h2><div class="sizes">
    <img src="icon-v2-kanban.svg" width="128" height="128">
    <img src="icon-v2-kanban.svg" width="64" height="64">
    <img src="icon-v2-kanban.svg" width="32" height="32">
    <img src="icon-v2-kanban.svg" width="16" height="16">
  </div></div>
  <div class="cand"><h2>V3 · 验收勾便签</h2><div class="sizes">
    <img src="icon-v3-check.svg" width="128" height="128">
    <img src="icon-v3-check.svg" width="64" height="64">
    <img src="icon-v3-check.svg" width="32" height="32">
    <img src="icon-v3-check.svg" width="16" height="16">
  </div></div>
</div>
<p class="cur">现有图标：<img src="../../../public/icon.svg" width="32" height="32"> （蓝紫渐变 + 白色卡片列，与软木主题不符）</p>
</body>
</html>
