<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="pin2" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ff6b5b"/>
      <stop offset="0.6" stop-color="#d93a2b"/>
      <stop offset="1" stop-color="#b02a1e"/>
    </radialGradient>
    <linearGradient id="cork2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2a272"/>
      <stop offset="1" stop-color="#b98c5c"/>
    </linearGradient>
  </defs>
  <!-- 软木板 -->
  <rect width="64" height="64" rx="14" fill="url(#cork2)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#a87a4e" stroke-width="1.5" opacity="0.5"/>
  <g fill="#a87a4e" opacity="0.28">
    <ellipse cx="8" cy="9" rx="2" ry="1.3"/>
    <ellipse cx="56" cy="10" rx="1.8" ry="1.2"/>
    <ellipse cx="7" cy="55" rx="2" ry="1.3"/>
    <ellipse cx="57" cy="54" rx="2.1" ry="1.4"/>
  </g>
  <!-- 三列迷你便利贴看板（每列微旋转） -->
  <g>
    <!-- 列 1：黄 + 粉 -->
    <g transform="rotate(-3 15 22)"><rect x="8" y="15" width="14" height="13" rx="1.5" fill="#8a6540" opacity="0.4" transform="translate(1 1.5)"/><rect x="8" y="15" width="14" height="13" rx="1.5" fill="#fff3a0"/></g>
    <g transform="rotate(2 15 38)"><rect x="8" y="32" width="14" height="12" rx="1.5" fill="#8a6540" opacity="0.4" transform="translate(1 1.5)"/><rect x="8" y="32" width="14" height="12" rx="1.5" fill="#ffd1dc"/></g>
    <!-- 列 2：蓝 + 黄 + 绿（进行中，最满，顶部图钉） -->
    <g transform="rotate(-2 32 22)"><rect x="25" y="16" width="14" height="11" rx="1.5" fill="#8a6540" opacity="0.4" transform="translate(1 1.5)"/><rect x="25" y="16" width="14" height="11" rx="1.5" fill="#c3e2ff"/></g>
    <g transform="rotate(2.5 32 35)"><rect x="25" y="30" width="14" height="11" rx="1.5" fill="#8a6540" opacity="0.4" transform="translate(1 1.5)"/><rect x="25" y="30" width="14" height="11" rx="1.5" fill="#fff3a0"/></g>
    <g transform="rotate(-2 32 48)"><rect x="25" y="44" width="14" height="11" rx="1.5" fill="#8a6540" opacity="0.4" transform="translate(1 1.5)"/><rect x="25" y="44" width="14" height="11" rx="1.5" fill="#cdf0c8"/></g>
    <!-- 列 3：绿大卡 + 黄小卡 -->
    <g transform="rotate(3 49 27)"><rect x="42" y="15" width="14" height="22" rx="1.5" fill="#8a6540" opacity="0.4" transform="translate(1 1.5)"/><rect x="42" y="15" width="14" height="22" rx="1.5" fill="#cdf0c8"/></g>
    <g transform="rotate(-2 49 45)"><rect x="42" y="41" width="14" height="9" rx="1.5" fill="#8a6540" opacity="0.4" transform="translate(1 1.5)"/><rect x="42" y="41" width="14" height="9" rx="1.5" fill="#fff3a0"/></g>
  </g>
  <!-- 图钉（钉在中列上方） -->
  <ellipse cx="32" cy="14.5" rx="4.4" ry="2" fill="#6b4c2e" opacity="0.35"/>
  <circle cx="32" cy="9.5" r="5.6" fill="url(#pin2)"/>
  <circle cx="32" cy="9.5" r="5.6" fill="none" stroke="#8c1f14" stroke-width="0.8" opacity="0.6"/>
  <ellipse cx="30" cy="7.6" rx="1.7" ry="1.1" fill="#ffffff" opacity="0.55"/>
</svg>
